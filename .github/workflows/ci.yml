name: CI

on:
  push:
    branches: [main, v1]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pillow opencv-python-headless imageio-ffmpeg pytest ruff
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest
      - name: Generated files are current
        run: |
          python tools/build_workflows.py --check
          python tools/build_docs.py --check
      - name: JS syntax
        run: node --check js/director_timeline.js
