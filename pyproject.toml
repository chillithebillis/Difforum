[project]
name = "difforum"
description = "Camera direction and timeline orchestration for ComfyUI: a visual Director timeline (scenes, camera moves, energy, audio reactions) that drives a Deforum-style feedback sampler on any image model, guides LTX-2 / MiniMax H3, and exports the camera to After Effects and Blender."
version = "1.0.0"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
# numpy and torch ship with ComfyUI. OpenCV (optical flow, webcam) is optional
# and imported lazily by the nodes that need it.
dependencies = ["numpy"]
classifiers = ["Operating System :: OS Independent"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "opencv-python-headless"]

[project.urls]
Repository = "https://github.com/chillithebillis/Difforum"
Documentation = "https://github.com/chillithebillis/Difforum/tree/main/docs"
"Bug Tracker" = "https://github.com/chillithebillis/Difforum/issues"

[tool.comfy]
PublisherId = "chillithebillis"
DisplayName = "Difforum"
Icon = "https://raw.githubusercontent.com/chillithebillis/Difforum/main/docs/media/icon.png"
includes = []

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["legacy", "tests/scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E731", "E741", "I001"]
